spring:
  application:
    name: crew-eval-pipeline
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crew_eval}
    username: ${DB_USERNAME:crew}
    password: ${DB_PASSWORD:crew}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  evaluation:
    max-job-claim-size: 10
    job-poll-delay-ms: 5000
    max-retries: 3
    latency-threshold-ms: 1000
    low-confidence-threshold: 0.65
    annotation-agreement-threshold: 0.60
    divergence-threshold: 0.25
    evaluator-version: v1
  suggestion:
    minimum-pattern-frequency: 2
  judge:
    provider: mock
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      api-key: ${OPENAI_API_KEY:}

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
