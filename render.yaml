services:
  - type: web
    name: crew-eval-pipeline
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: PGHOST
        fromDatabase:
          name: crew-eval-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: crew-eval-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: crew-eval-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: crew-eval-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: crew-eval-db
          property: password

databases:
  - name: crew-eval-db
    plan: free
